name: Release

# Push a tag named after the version in manifest.json, such as 0.2.0, to draft a release.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches manifest.json
        # Obsidian and BRAT look up a release by the version in manifest.json.
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME" --generate-notes
